<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Slideshow</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Raleway:wght@100;200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --dur: 8s;
    --trans: 1.8s;
    --ease-cin: cubic-bezier(0.4, 0, 0.2, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Raleway', sans-serif;
    cursor: none;
  }

  /* ── STAGE ── */
  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
  }

  /* ── SLIDE ── */
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .slide.active   { opacity: 1; z-index: 2; pointer-events: auto; }
  .slide.prev     { opacity: 1; z-index: 1; pointer-events: none; }
  .slide.leaving  { opacity: 1; z-index: 1; }

  /* Image layer – always bigger than viewport so Ken Burns has room */
  .slide__img {
    position: absolute;
    inset: -8%;          /* 16% extra space all around */
    width: 116%; height: 116%;
    background-size: cover;
    background-position: center;
    will-change: transform, opacity;
    transform: scale(1) translate(0, 0);
    opacity: 0;
    transition: opacity var(--trans) var(--ease-cin);
  }

  .slide.active .slide__img {
    opacity: 1;
    animation: kenburns var(--dur) ease-in-out forwards;
  }

  /* Six Ken Burns variants – each slide picks a different one */
  @keyframes kenburns   { from { transform: scale(1.15) translate( 0%,  0%); }  to { transform: scale(1.0)  translate(-3%, -2%); } }
  @keyframes kenburns-b { from { transform: scale(1.0)  translate(-3%, -2%); }  to { transform: scale(1.15) translate( 2%,  1%); } }
  @keyframes kenburns-c { from { transform: scale(1.2)  translate( 2%, -1%); }  to { transform: scale(1.05) translate(-2%,  2%); } }
  @keyframes kenburns-d { from { transform: scale(1.05) translate(-1%,  1%); }  to { transform: scale(1.18) translate( 1%, -1%); } }
  @keyframes kenburns-e { from { transform: scale(1.1)  translate( 1%,  2%); }  to { transform: scale(1.0)  translate(-1%, -2%); } }
  @keyframes kenburns-f { from { transform: scale(1.0)  translate( 0%,  1%); }  to { transform: scale(1.12) translate(-2%, -1%); } }

  .slide:nth-child(1) .slide__img  { animation-name: kenburns;   }
  .slide:nth-child(2) .slide__img  { animation-name: kenburns-b; }
  .slide:nth-child(3) .slide__img  { animation-name: kenburns-c; }
  .slide:nth-child(4) .slide__img  { animation-name: kenburns-d; }
  .slide:nth-child(5) .slide__img  { animation-name: kenburns-e; }
  .slide:nth-child(6) .slide__img  { animation-name: kenburns-f; }
  .slide:nth-child(7) .slide__img  { animation-name: kenburns;   }
  .slide:nth-child(8) .slide__img  { animation-name: kenburns-c; }

  /* Cross-dissolve: outgoing slide fades out while incoming fades in */
  .slide.leaving .slide__img {
    animation: none;
    opacity: 0;
    transition: opacity var(--trans) var(--ease-cin);
  }

  /* ── COLOUR GRADE OVERLAY ── */
  .slide__grade {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0;
    transition: opacity var(--trans) var(--ease-cin);
  }
  .slide.active .slide__grade { opacity: 1; }

  /* Each slide has its own cinematic grade */
  .slide:nth-child(1) .slide__grade  { background: linear-gradient(160deg, rgba(30,20,60,0.55) 0%, rgba(0,0,0,0.25) 50%, rgba(80,40,0,0.35) 100%); }
  .slide:nth-child(2) .slide__grade  { background: linear-gradient(200deg, rgba(0,30,60,0.5) 0%, rgba(0,0,0,0.2) 60%, rgba(20,60,40,0.4) 100%); }
  .slide:nth-child(3) .slide__grade  { background: linear-gradient(140deg, rgba(60,20,0,0.45) 0%, rgba(0,0,0,0.3) 50%, rgba(10,30,60,0.4) 100%); }
  .slide:nth-child(4) .slide__grade  { background: linear-gradient(180deg, rgba(5,20,40,0.5) 0%, rgba(0,0,0,0.1) 50%, rgba(40,60,20,0.45) 100%); }
  .slide:nth-child(5) .slide__grade  { background: linear-gradient(220deg, rgba(40,0,30,0.5) 0%, rgba(0,0,0,0.2) 55%, rgba(60,30,0,0.4) 100%); }
  .slide:nth-child(6) .slide__grade  { background: linear-gradient(160deg, rgba(0,40,60,0.45) 0%, rgba(0,0,0,0.25) 50%, rgba(30,0,50,0.4) 100%); }
  .slide:nth-child(7) .slide__grade  { background: linear-gradient(200deg, rgba(60,40,0,0.5) 0%, rgba(0,0,0,0.25) 50%, rgba(0,20,50,0.4) 100%); }
  .slide:nth-child(8) .slide__grade  { background: linear-gradient(150deg, rgba(20,40,20,0.45) 0%, rgba(0,0,0,0.2) 50%, rgba(50,20,0,0.4) 100%); }

  /* ── VIGNETTE ── */
  .vignette {
    position: fixed;
    inset: 0; z-index: 10;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
  }

  /* ── FILM GRAIN ── */
  .grain {
    position: fixed;
    inset: 0; z-index: 11;
    opacity: 0.025;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
    animation: grain-shift 0.08s steps(1) infinite;
  }
  @keyframes grain-shift {
    0%  { background-position:   0px   0px; }
    20% { background-position: -64px -32px; }
    40% { background-position:  32px  64px; }
    60% { background-position: -32px  32px; }
    80% { background-position:  64px -64px; }
    100%{ background-position:  0px   0px; }
  }

  /* ── CAPTION ── */
  .caption {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    padding: 4rem 6vw 3rem;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
    pointer-events: none;
  }

  .caption__label {
    font-family: 'Raleway', sans-serif;
    font-weight: 100;
    font-size: clamp(0.6rem, 1.2vw, 0.75rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 0.5rem;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.9s 0.4s ease, transform 0.9s 0.4s ease;
  }

  .caption__title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2rem, 5vw, 4rem);
    color: #fff;
    line-height: 1.1;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1.1s 0.5s ease, transform 1.1s 0.5s ease;
  }

  .caption__sub {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: clamp(0.65rem, 1.3vw, 0.8rem);
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.45);
    margin-top: 0.8rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.9s 0.7s ease, transform 0.9s 0.7s ease;
  }

  .caption.visible .caption__label,
  .caption.visible .caption__title,
  .caption.visible .caption__sub {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── PROGRESS BAR ── */
  .progress {
    position: fixed;
    bottom: 0; left: 0;
    height: 1px;
    background: rgba(255,255,255,0.9);
    z-index: 30;
    width: 0%;
    transition: width linear;
  }

  /* ── INDEX DOTS ── */
  .dots {
    position: fixed;
    right: 3vw;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    cursor: pointer;
    transition: background 0.4s, transform 0.4s;
    pointer-events: auto;
  }
  .dot.active { background: #fff; transform: scale(1.8); }

  /* ── CONTROLS ── */
  .ctrl {
    position: fixed;
    top: 50%; z-index: 25;
    transform: translateY(-50%);
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.4s, background 0.3s, transform 0.25s;
  }
  .ctrl:hover { background: rgba(255,255,255,0.18); transform: translateY(-50%) scale(1.08); }
  .ctrl svg { width: 18px; height: 18px; stroke: rgba(255,255,255,0.85); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ctrl-prev { left: 3vw; }
  .ctrl-next { right: 3vw; }

  .stage:hover .ctrl { opacity: 1; }

  /* ── PAUSE PILL ── */
  .pause-pill {
    position: fixed;
    top: 2rem; right: 3vw;
    z-index: 30;
    display: flex; align-items: center; gap: 8px;
    padding: 0.4rem 0.9rem;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 100px;
    color: rgba(255,255,255,0.7);
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
    opacity: 0;
    pointer-events: none;
  }
  .pause-pill .pip {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.6);
    transition: background 0.3s;
  }
  .pause-pill.playing .pip { background: #7ef; animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

  .stage:hover .pause-pill { opacity: 1; pointer-events: auto; }

  /* ── CURSOR ── */
  .cursor {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    z-index: 9999;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: width 0.25s, height 0.25s, background 0.25s, transform 0.25s;
    mix-blend-mode: difference;
  }

  /* ── SKIP INTRO ── */
  .skip {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;
    color: rgba(255,255,255,0.9);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    letter-spacing: 0.1em;
    text-align: center;
    pointer-events: none;
    opacity: 1;
    transition: opacity 1.2s ease;
  }
  .skip.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<!-- Custom cursor -->
<div class="cursor" id="cursor"></div>

<!-- Ambient overlays -->
<div class="vignette"></div>
<div class="grain"></div>

<!-- Stage -->
<div class="stage" id="stage">

  <!-- SLIDE 1 – Mountains -->
  <div class="slide">
    <div class="slide__img" style="background-image:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=85&auto=format&fit=crop')"></div>
    <div class="slide__grade"></div>
  </div>

  <!-- SLIDE 2 – Ocean -->
  <div class="slide">
    <div class="slide__img" style="background-image:url('https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1920&q=85&auto=format&fit=crop')"></div>
    <div class="slide__grade"></div>
  </div>

  <!-- SLIDE 3 – Desert Dunes -->
  <div class="slide">
    <div class="slide__img" style="background-image:url('https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1920&q=85&auto=format&fit=crop')"></div>
    <div class="slide__grade"></div>
  </div>

  <!-- SLIDE 4 – Forest -->
  <div class="slide">
    <div class="slide__img" style="background-image:url('https://images.unsplash.com/photo-1448375240586-882707db888b?w=1920&q=85&auto=format&fit=crop')"></div>
    <div class="slide__grade"></div>
  </div>

  <!-- SLIDE 5 – Aurora -->
  <div class="slide">
    <div class="slide__img" style="background-image:url('https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=1920&q=85&auto=format&fit=crop')"></div>
    <div class="slide__grade"></div>
  </div>

  <!-- SLIDE 6 – City at Night -->
  <div class="slide">
    <div class="slide__img" style="background-image:url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1920&q=85&auto=format&fit=crop')"></div>
    <div class="slide__grade"></div>
  </div>

  <!-- SLIDE 7 – Lavender Field -->
  <div class="slide">
    <div class="slide__img" style="background-image:url('https://images.unsplash.com/photo-1499002238440-d264edd596ec?w=1920&q=85&auto=format&fit=crop')"></div>
    <div class="slide__grade"></div>
  </div>

  <!-- SLIDE 8 – Milky Way -->
  <div class="slide">
    <div class="slide__img" style="background-image:url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=85&auto=format&fit=crop')"></div>
    <div class="slide__grade"></div>
  </div>

  <!-- Prev / Next buttons -->
  <div class="ctrl ctrl-prev" id="btnPrev">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </div>
  <div class="ctrl ctrl-next" id="btnNext">
    <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
  </div>
</div>

<!-- Caption -->
<div class="caption" id="caption">
  <div class="caption__label" id="capLabel">Scene</div>
  <div class="caption__title" id="capTitle">Title</div>
  <div class="caption__sub"   id="capSub">Location</div>
</div>

<!-- Progress bar -->
<div class="progress" id="progress"></div>

<!-- Index dots -->
<nav class="dots" id="dots"></nav>

<!-- Pause pill -->
<div class="pause-pill playing" id="pausePill">
  <span class="pip"></span>
  <span id="pillLabel">playing</span>
</div>

<!-- Skip / opening -->
<div class="skip" id="skip">— a cinematic journey —</div>

<script>
(function(){
  const SLIDES = [
    { label: 'I',    title: 'The Summit',          sub: 'Swiss Alps, Switzerland' },
    { label: 'II',   title: 'Infinite Blue',        sub: 'Maldives, Indian Ocean' },
    { label: 'III',  title: 'Dunes at Dusk',        sub: 'Sahara Desert, Morocco' },
    { label: 'IV',   title: 'Cathedral of Light',   sub: 'Redwood National Park, California' },
    { label: 'V',    title: 'Dancing Skies',         sub: 'Tromsø, Norway' },
    { label: 'VI',   title: 'The Sleepless City',   sub: 'Manhattan, New York' },
    { label: 'VII',  title: 'Fields of Violet',     sub: 'Provence, France' },
    { label: 'VIII', title: 'River of Stars',       sub: 'Atacama Desert, Chile' },
  ];

  const DURATION = 8000;  // ms per slide
  const TRANS    = 1800;  // ms cross-dissolve

  const slides   = document.querySelectorAll('.slide');
  const caption  = document.getElementById('caption');
  const capLabel = document.getElementById('capLabel');
  const capTitle = document.getElementById('capTitle');
  const capSub   = document.getElementById('capSub');
  const progress = document.getElementById('progress');
  const dotsWrap = document.getElementById('dots');
  const pausePill= document.getElementById('pausePill');
  const pillLabel= document.getElementById('pillLabel');
  const btnPrev  = document.getElementById('btnPrev');
  const btnNext  = document.getElementById('btnNext');
  const skipEl   = document.getElementById('skip');
  const cursor   = document.getElementById('cursor');

  let current = 0, paused = false;
  let timer, progTimer, progStart, progPaused;
  let progElapsed = 0;

  /* ── Dots ── */
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(d);
  });
  const dotEls = dotsWrap.querySelectorAll('.dot');

  /* ── Cursor tracking ── */
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });

  /* ── Activate a slide ── */
  function activate(idx) {
    const prev = current;
    current = ((idx % slides.length) + slides.length) % slides.length;

    // Mark outgoing
    slides[prev].classList.remove('active');
    slides[prev].classList.add('leaving');
    setTimeout(() => slides[prev].classList.remove('leaving'), TRANS + 100);

    // Reset Ken Burns by cloning the img element
    const newSlide = slides[current];
    const oldImg   = newSlide.querySelector('.slide__img');
    const freshImg = oldImg.cloneNode(true);
    oldImg.parentNode.replaceChild(freshImg, oldImg);

    // Activate incoming
    newSlide.classList.add('active');

    // Update dots
    dotEls.forEach((d, i) => d.classList.toggle('active', i === current));

    // Update caption
    caption.classList.remove('visible');
    setTimeout(() => {
      capLabel.textContent = SLIDES[current].label;
      capTitle.textContent = SLIDES[current].title;
      capSub.textContent   = SLIDES[current].sub;
      caption.classList.add('visible');
    }, 300);
  }

  /* ── Go to a specific slide ── */
  function goTo(idx) {
    clearTimeout(timer);
    clearProgress();
    activate(idx);
    if (!paused) startProgress();
    scheduleNext();
  }

  /* ── Schedule auto-advance ── */
  function scheduleNext() {
    clearTimeout(timer);
    if (paused) return;
    timer = setTimeout(() => {
      activate(current + 1);
      startProgress();
      scheduleNext();
    }, DURATION);
  }

  /* ── Progress bar ── */
  function startProgress() {
    clearProgress();
    progElapsed = 0;
    progress.style.transition = 'none';
    progress.style.width = '0%';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        progress.style.transition = `width ${DURATION}ms linear`;
        progress.style.width = '100%';
      });
    });
    progStart = performance.now();
  }

  function clearProgress() {
    const el = progress;
    const computed = parseFloat(getComputedStyle(el).width);
    const pct = (computed / window.innerWidth) * 100;
    el.style.transition = 'none';
    el.style.width = pct + '%';
    progElapsed = pct / 100 * DURATION;
  }

  /* ── Pause / Resume ── */
  function togglePause() {
    paused = !paused;
    if (paused) {
      clearTimeout(timer);
      clearProgress();
      progPaused = progElapsed;
      pausePill.classList.remove('playing');
      pillLabel.textContent = 'paused';
    } else {
      const remaining = DURATION - progElapsed;
      pausePill.classList.add('playing');
      pillLabel.textContent = 'playing';
      progress.style.transition = `width ${remaining}ms linear`;
      progress.style.width = '100%';
      progStart = performance.now() - progElapsed;
      timer = setTimeout(() => {
        activate(current + 1);
        startProgress();
        scheduleNext();
      }, remaining);
    }
  }

  /* ── Controls ── */
  btnPrev.addEventListener('click', () => goTo(current - 1));
  btnNext.addEventListener('click', () => goTo(current + 1));
  pausePill.addEventListener('click', togglePause);

  /* ── Keyboard ── */
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft')  goTo(current - 1);
    if (e.key === ' ')          togglePause();
  });

  /* ── Start ── */
  // Fade skip intro
  setTimeout(() => { skipEl.classList.add('hidden'); }, 2200);

  // First slide
  activate(0);
  startProgress();
  scheduleNext();
})();
</script>
</body>
</html>
