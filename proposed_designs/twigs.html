<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Interactive Vine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            /* A soft sky background to make the green pop */
            background: linear-gradient(to bottom, #87CEEB 0%, #e0f6ff 100%);
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: sans-serif;
            color: #333;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">Live Horizontal Vine<br><small>Reacting to simulated wind & gravity</small></div>
    <canvas id="vineCanvas"></canvas>

    <script>
        const canvas = document.getElementById('vineCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, targetDist;

        const numPoints = 25; // Fewer points = stiffer, more brittle looking segments
        const points = [];
        let time = 0;
        let currentWind = 0;

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            targetDist = (width / numPoints) * 1.05; // 5% slack so it hangs nicely

            points.length = 0; // Clear existing
            
            for (let i = 0; i <= numPoints; i++) {
                // Give it a slight starting curve so the physics don't snap aggressively
                let progress = i / numPoints;
                let drop = Math.sin(progress * Math.PI) * 80;
                
                // Generate random leaves for each node
                let leaves = [];
                if (i > 0 && i < numPoints) { 
                    let numLeaves = Math.floor(Math.random() * 3) + 1; // 1 to 3 leaves per node
                    for(let j = 0; j < numLeaves; j++) {
                        leaves.push({
                            // Angle relative to the stem
                            angleOffset: (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 6 + Math.random() * Math.PI / 3),
                            scale: 0.6 + Math.random() * 0.7,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                }

                points.push({
                    x: i * (width / numPoints),
                    y: (height / 4) + drop,
                    ox: i * (width / numPoints),
                    oy: (height / 4) + drop,
                    mass: 1 + Math.random() * 0.5,
                    // Visual offsets create the "brittle/crooked" look without breaking physics
                    visualOffsetX: (Math.random() - 0.5) * 15,
                    visualOffsetY: (Math.random() - 0.5) * 15,
                    leaves: leaves
                });
            }
        }

        function update() {
            time += 0.05;

            // Generate organic wind using overlapping sine waves
            let windBase = Math.sin(time * 0.5) * 0.3;
            let windGust = Math.max(0, Math.sin(time * 1.2)) * Math.sin(time * 2.5) * 2.5;
            currentWind = windBase + windGust;

            const gravity = 0.3;

            // 1. Apply Forces & Integrate (Verlet Physics)
            for (let i = 1; i < numPoints; i++) {
                let p = points[i];
                
                // Calculate velocity based on previous position (friction = 0.96)
                let vx = (p.x - p.ox) * 0.96;
                let vy = (p.y - p.oy) * 0.96;

                p.ox = p.x;
                p.oy = p.y;

                // Apply gravity and wind
                p.y += gravity * p.mass;
                p.x += currentWind / p.mass;
                p.y -= Math.abs(currentWind) * 0.1 / p.mass; // Wind gives slight upward lift

                // Apply velocity
                p.x += vx;
                p.y += vy;
            }

            // 2. Resolve Constraints (Keep segments together)
            const iterations = 15; // Higher = stiffer stem
            for (let iter = 0; iter < iterations; iter++) {
                for (let i = 0; i < numPoints; i++) {
                    let p1 = points[i];
                    let p2 = points[i + 1];

                    let dx = p2.x - p1.x;
                    let dy = p2.y - p1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let diff = targetDist - dist;
                    let percent = (diff / dist) * 0.5;
                    let offsetX = dx * percent;
                    let offsetY = dy * percent;

                    if (i !== 0) {
                        p1.x -= offsetX;
                        p1.y -= offsetY;
                    }
                    if (i + 1 !== numPoints) {
                        p2.x += offsetX;
                        p2.y += offsetY;
                    }
                }
            }

            // 3. Lock endpoints to the sides of the screen
            points[0].x = 0;
            points[0].y = height / 4;
            points[numPoints].x = width;
            points[numPoints].y = height / 4;
        }

        function drawLeaf(x, y, angle, scale, phase) {
            ctx.save();
            ctx.translate(x, y);
            
            // Leaves flutter rapidly depending on the wind strength
            let flutter = Math.sin(time * 4 + phase) * 0.2 * (Math.abs(currentWind) + 0.2);
            ctx.rotate(angle + flutter);
            ctx.scale(scale, scale);

            // Leaf color gradient
            let gradient = ctx.createLinearGradient(0, 0, 35, 0);
            gradient.addColorStop(0, "#2e7d32"); // Deep green
            gradient.addColorStop(1, "#66bb6a"); // Fresh bright green

            ctx.fillStyle = gradient;
            
            // Draw organic leaf shape
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(15, -15, 35, 0); // Top edge
            ctx.quadraticCurveTo(15, 15, 0, 0);   // Bottom edge
            ctx.fill();

            // Draw center vein
            ctx.strokeStyle = "rgba(0, 50, 0, 0.3)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(15, -2, 30, 0);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Draw Main Brittle Stem
            ctx.beginPath();
            ctx.moveTo(points[0].x + points[0].visualOffsetX, points[0].y + points[0].visualOffsetY);
            for (let i = 1; i <= numPoints; i++) {
                ctx.lineTo(points[i].x + points[i].visualOffsetX, points[i].y + points[i].visualOffsetY);
            }
            
            // Outer bark
            ctx.strokeStyle = "#3e2723"; 
            ctx.lineWidth = 6;
            ctx.lineJoin = "bevel"; // Bevel joins make it look more like cracked wood
            ctx.stroke();

            // Inner wood highlight for texture
            ctx.beginPath();
            ctx.moveTo(points[0].x + points[0].visualOffsetX, points[0].y + points[0].visualOffsetY - 1);
            for (let i = 1; i <= numPoints; i++) {
                ctx.lineTo(points[i].x + points[i].visualOffsetX, points[i].y + points[i].visualOffsetY - 1);
            }
            ctx.strokeStyle = "#5d4037";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw Twigs and Leaves
            for (let i = 1; i < numPoints; i++) {
                let p = points[i];
                let prev = points[i - 1];
                
                // Calculate exact visual coordinates including the crooked offset
                let px = p.x + p.visualOffsetX;
                let py = p.y + p.visualOffsetY;
                let prevX = prev.x + prev.visualOffsetX;
                let prevY = prev.y + prev.visualOffsetY;

                let baseAngle = Math.atan2(py - prevY, px - prevX);

                p.leaves.forEach(leaf => {
                    let leafAngle = baseAngle + leaf.angleOffset;
                    let twigLength = 10 * leaf.scale;
                    let twigX = px + Math.cos(leafAngle) * twigLength;
                    let twigY = py + Math.sin(leafAngle) * twigLength;

                    // Draw the tiny twig connecting the leaf
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(twigX, twigY);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "#4a3728";
                    ctx.stroke();

                    // Draw the actual leaf
                    drawLeaf(twigX, twigY, leafAngle, leaf.scale, leaf.phase);
                });
            }
        }

        function animate() {
            update();
            draw();
            requestAnimationFrame(animate);
        }

        // Handle window resizing gracefully
        window.addEventListener('resize', init);

        // Start
        init();
        animate();
    </script>
</body>
</html>
