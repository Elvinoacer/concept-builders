<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Similar Designs – House Plans</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: #f5f4f1;
    color: #1a1a1a;
    padding: 2rem 1.5rem;
  }

  /* === DEMO BANNER (remove in production) === */
  .demo-banner {
    background: #fff;
    border: 0.5px solid #e0ddd6;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 2rem;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .demo-banner-img {
    width: 80px; height: 60px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
  }
  .demo-banner h1 { font-size: 17px; font-weight: 500; margin-bottom: 4px; }
  .demo-banner p  { font-size: 13px; color: #666; }

  /* === SIMILAR SECTION === */
  :root {
    --c-bg: #ffffff;
    --c-bg2: #f5f4f1;
    --c-text: #1a1a1a;
    --c-text2: #555;
    --c-text3: #999;
    --c-border: rgba(0,0,0,0.1);
    --c-border2: rgba(0,0,0,0.18);
    --c-info: #185FA5;
    --card-radius: 14px;
    --transition: 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --c-bg: #1c1c1e;
      --c-bg2: #111;
      --c-text: #f0f0f0;
      --c-text2: #a0a0a0;
      --c-text3: #666;
      --c-border: rgba(255,255,255,0.1);
      --c-border2: rgba(255,255,255,0.2);
      --c-info: #5baaf5;
    }
    body { background: var(--c-bg2); color: var(--c-text); }
    .demo-banner { background: #1c1c1e; border-color: rgba(255,255,255,0.1); }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0,0,0,0);
  }
  .similar-section { padding: 2.5rem 0 3rem; overflow: hidden; }

  .section-divider { height: 0.5px; background: var(--c-border); margin-bottom: 2rem; }

  .section-header {
    display: flex; align-items: flex-end;
    justify-content: space-between; margin-bottom: 1.75rem; padding: 0 4px;
  }
  .section-header-left h2 {
    font-size: 22px; font-weight: 500; color: var(--c-text); margin-bottom: 4px;
  }
  .section-header-left p { font-size: 13px; color: var(--c-text2); }

  .tab-pills { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .tab-pill {
    padding: 6px 16px; border-radius: 20px;
    border: 0.5px solid var(--c-border2);
    background: transparent; font-size: 13px; font-weight: 400;
    color: var(--c-text2); cursor: pointer; transition: var(--transition);
  }
  .tab-pill.active {
    background: var(--c-text); color: var(--c-bg); border-color: transparent;
  }
  .tab-pill:hover:not(.active) { background: var(--c-border); color: var(--c-text); }

  .carousel-wrapper { position: relative; }
  .carousel-track {
    display: flex; gap: 16px;
    overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; padding-bottom: 6px; scroll-behavior: smooth;
  }
  .carousel-track::-webkit-scrollbar { display: none; }

  .plan-card {
    flex: 0 0 220px; scroll-snap-align: start;
    border-radius: var(--card-radius); border: 0.5px solid var(--c-border);
    background: var(--c-bg); overflow: hidden; cursor: pointer;
    transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
    position: relative; transform-origin: bottom center;
  }
  .plan-card:hover {
    transform: translateY(-6px) scale(1.025);
    border-color: var(--c-border2);
    box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    z-index: 2;
  }
  .plan-card.featured { flex: 0 0 260px; }

  .card-img-wrap {
    position: relative; height: 148px; overflow: hidden; background: var(--c-bg2);
  }
  .plan-card.featured .card-img-wrap { height: 174px; }
  .card-img-wrap img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .plan-card:hover .card-img-wrap img { transform: scale(1.06); }

  .match-badge {
    position: absolute; top: 10px; left: 10px;
    background: rgba(29,158,117,0.92); color: #fff;
    font-size: 11px; font-weight: 500;
    padding: 3px 9px; border-radius: 20px; letter-spacing: 0.01em;
  }
  .new-badge {
    position: absolute; top: 10px; right: 10px;
    background: rgba(186,117,23,0.92); color: #fff;
    font-size: 11px; font-weight: 500;
    padding: 3px 9px; border-radius: 20px;
  }

  .wishlist-btn {
    position: absolute; bottom: 10px; right: 10px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.42); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0; transform: scale(0.85);
    transition: opacity 0.22s ease, transform 0.22s ease, background 0.18s;
    color: #fff; font-size: 15px;
  }
  .plan-card:hover .wishlist-btn { opacity: 1; transform: scale(1); }
  .wishlist-btn.saved { background: rgba(212,83,126,0.82); opacity: 1; transform: scale(1); }
  .wishlist-btn:hover { background: rgba(212,83,126,0.9) !important; }

  .quick-view-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.52);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
    border-radius: var(--card-radius);
  }
  .plan-card:hover .quick-view-overlay { opacity: 1; pointer-events: auto; }
  .quick-view-btn {
    background: #fff; border: none; padding: 8px 20px;
    border-radius: 20px; font-size: 13px; font-weight: 500;
    color: #1a1a1a; cursor: pointer;
    transform: translateY(6px); transition: transform 0.25s;
  }
  .plan-card:hover .quick-view-btn { transform: translateY(0); }

  .card-body { padding: 14px 14px 16px; }
  .card-title {
    font-size: 14px; font-weight: 500; color: var(--c-text);
    margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-style-tag {
    font-size: 11px; color: var(--c-text3);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px;
  }
  .card-specs { display: flex; gap: 10px; margin-bottom: 11px; }
  .spec-chip { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--c-text2); }
  .spec-chip i { font-size: 13px; }

  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 0.5px solid var(--c-border); padding-top: 11px;
  }
  .card-price { font-size: 15px; font-weight: 500; color: var(--c-text); }
  .card-price span { font-size: 11px; font-weight: 400; color: var(--c-text3); }
  .card-rating { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--c-text2); }
  .card-rating i { font-size: 13px; color: #EF9F27; }

  .arrow-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--c-bg); border: 0.5px solid var(--c-border2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 5;
    transition: background var(--transition), transform 0.2s;
    color: var(--c-text); font-size: 18px;
  }
  .arrow-btn:hover { background: var(--c-bg2); }
  .arrow-btn:active { transform: translateY(-50%) scale(0.93); }
  .arrow-left { left: -18px; }
  .arrow-right { right: -18px; }

  .see-all-link {
    font-size: 13px; color: var(--c-info); text-decoration: none;
    display: flex; align-items: center; gap: 4px; transition: gap 0.2s;
  }
  .see-all-link:hover { gap: 8px; }

  .progress-dots { display: flex; justify-content: center; gap: 6px; margin-top: 18px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--c-border2); transition: width 0.3s, background 0.3s; cursor: pointer;
  }
  .dot.active { width: 20px; border-radius: 3px; background: var(--c-text); }
</style>
</head>
<body>

<!-- Demo context banner — remove in production -->
<div class="demo-banner">
  <img class="demo-banner-img" src="https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=160&q=80&auto=format&fit=crop" alt="Modern Farmhouse 4BR" />
  <div>
    <h1>Modern Farmhouse 4BR — Plan #MF-4840</h1>
    <p>4 Bed · 3 Bath · 2,840 sqft · $390</p>
  </div>
</div>

<!-- ============================================================
     SIMILAR DESIGNS SECTION — paste everything below this line
     ============================================================ -->
<section class="similar-section" aria-labelledby="similar-heading">
  <h2 class="sr-only" id="similar-heading">Similar house plan designs you might like</h2>

  <div class="section-divider"></div>

  <div class="section-header">
    <div class="section-header-left">
      <h2>Similar designs you'll love</h2>
      <p>Based on the Modern Farmhouse 4BR you're viewing</p>
    </div>
    <a href="/plans" class="see-all-link">
      See all <i class="ti ti-arrow-right" aria-hidden="true"></i>
    </a>
  </div>

  <div class="tab-pills" role="tablist" aria-label="Filter recommendations">
    <button class="tab-pill active" role="tab" aria-selected="true"  onclick="setTab(this,'related')">Related houses</button>
    <button class="tab-pill"        role="tab" aria-selected="false" onclick="setTab(this,'layout')">Similar layouts</button>
    <button class="tab-pill"        role="tab" aria-selected="false" onclick="setTab(this,'style')">Similar styles</button>
  </div>

  <div class="carousel-wrapper">
    <button class="arrow-btn arrow-left" aria-label="Scroll left"  onclick="scrollTrack(-1)">
      <i class="ti ti-chevron-left" aria-hidden="true"></i>
    </button>

    <div class="carousel-track" id="track" role="list"></div>

    <button class="arrow-btn arrow-right" aria-label="Scroll right" onclick="scrollTrack(1)">
      <i class="ti ti-chevron-right" aria-hidden="true"></i>
    </button>
  </div>

  <div class="progress-dots" id="dots" aria-hidden="true">
    <div class="dot active" onclick="goPage(0)"></div>
    <div class="dot" onclick="goPage(1)"></div>
    <div class="dot" onclick="goPage(2)"></div>
  </div>
</section>

<script>
const track = document.getElementById('track');
const dots  = document.querySelectorAll('.dot');

/* ── Data ── */
const tabData = {
  related: [
    { name:'Prairie Ridge Estate',  style:'Modern Farmhouse',      beds:4, baths:3, sqft:'2,840', price:'$390', rating:'4.9', count:112, match:97, src:'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=520&q=80&auto=format&fit=crop', featured:true },
    { name:'Oakwood Craftsman',     style:'Craftsman',             beds:4, baths:2, sqft:'2,490', price:'$275', rating:'4.7', count:88,  match:93, src:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=440&q=80&auto=format&fit=crop', isNew:true },
    { name:'Horizon Modern',        style:'Contemporary',          beds:5, baths:4, sqft:'3,200', price:'$450', rating:'4.8', count:67,  match:89, src:'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=440&q=80&auto=format&fit=crop' },
    { name:'Maple Grove Ranch',     style:'Ranch / Single-story',  beds:3, baths:2, sqft:'1,850', price:'$195', rating:'4.6', count:145, match:85, src:'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=440&q=80&auto=format&fit=crop' },
    { name:'Coastal Retreat',       style:'Beach / Coastal',       beds:4, baths:3, sqft:'2,650', price:'$340', rating:'4.9', count:203, match:81, src:'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=440&q=80&auto=format&fit=crop' },
    { name:'Sycamore Cottage',      style:'Cottage / Traditional', beds:3, baths:2, sqft:'1,680', price:'$165', rating:'4.5', count:59,  src:'https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=440&q=80&auto=format&fit=crop', isNew:true },
  ],
  layout: [
    { name:'Open Concept Villa',    style:'Open Floor Plan',       beds:4, baths:3, sqft:'2,720', price:'$360', rating:'4.8', count:97,  match:95, src:'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=440&q=80&auto=format&fit=crop', featured:true },
    { name:'Split-Level Sunset',    style:'Split Level',           beds:4, baths:2, sqft:'2,100', price:'$240', rating:'4.6', count:73,  match:88, src:'https://images.unsplash.com/photo-1523217582562-09d0def993a6?w=440&q=80&auto=format&fit=crop' },
    { name:'Courtyard Manor',       style:'U-Shape Layout',        beds:5, baths:4, sqft:'3,400', price:'$480', rating:'4.7', count:44,  match:82, src:'https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=440&q=80&auto=format&fit=crop' },
    { name:'Duplex Master',         style:'Two-Story Open',        beds:4, baths:3, sqft:'2,560', price:'$310', rating:'4.5', count:61,  match:77, src:'https://images.unsplash.com/photo-1583608205776-bfd35f0d9f83?w=440&q=80&auto=format&fit=crop' },
    { name:'Great Room Classic',    style:'Traditional Open',      beds:3, baths:2, sqft:'2,020', price:'$220', rating:'4.7', count:118, match:72, src:'https://images.unsplash.com/photo-1549517045-bc93de075e53?w=440&q=80&auto=format&fit=crop' },
  ],
  style: [
    { name:'Birchwood Barndo',      style:'Barndominium',          beds:3, baths:2, sqft:'1,980', price:'$210', rating:'4.8', count:130, match:91, src:'https://images.unsplash.com/photo-1605276374104-dee2a0ed3cd6?w=440&q=80&auto=format&fit=crop', featured:true },
    { name:'Timber Haven',          style:'Modern Farmhouse',      beds:4, baths:3, sqft:'2,600', price:'$350', rating:'4.9', count:156, match:86, src:'https://images.unsplash.com/photo-1600047509782-20d39509f26d?w=440&q=80&auto=format&fit=crop' },
    { name:'Cedar Springs',         style:'Rustic Modern',         beds:4, baths:2, sqft:'2,300', price:'$290', rating:'4.6', count:82,  match:80, src:'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=440&q=80&auto=format&fit=crop' },
    { name:'Ironwood Modern',       style:'Industrial Farmhouse',  beds:5, baths:4, sqft:'3,100', price:'$420', rating:'4.7', count:55,  match:74, src:'https://images.unsplash.com/photo-1554995207-c18c203602cb?w=440&q=80&auto=format&fit=crop', isNew:true },
    { name:'White Gable Home',      style:'Modern Farmhouse',      beds:3, baths:2, sqft:'1,920', price:'$230', rating:'4.8', count:99,  match:68, src:'https://images.unsplash.com/photo-1572120360610-d971b9d7767c?w=440&q=80&auto=format&fit=crop' },
  ]
};

/* ── Build a card element ── */
function buildCard(p) {
  const card = document.createElement('article');
  card.className = 'plan-card' + (p.featured ? ' featured' : '');
  card.setAttribute('role', 'listitem');
  card.setAttribute('tabindex', '0');
  card.innerHTML = `
    <div class="card-img-wrap">
      <img src="${p.src}" alt="${p.name} house plan" loading="lazy" />
      ${p.match  ? `<span class="match-badge" aria-label="${p.match}% match">${p.match}% match</span>` : ''}
      ${p.isNew  ? '<span class="new-badge">New</span>' : ''}
      <button class="wishlist-btn" aria-label="Save ${p.name} to wishlist" onclick="toggleWish(event,this)">
        <i class="ti ti-heart" aria-hidden="true"></i>
      </button>
      <div class="quick-view-overlay" aria-hidden="true">
        <button class="quick-view-btn" onclick="quickView(event,'${p.name}')">Quick view</button>
      </div>
    </div>
    <div class="card-body">
      <div class="card-title">${p.name}</div>
      <div class="card-style-tag">${p.style}</div>
      <div class="card-specs">
        <span class="spec-chip"><i class="ti ti-bed" aria-hidden="true"></i> ${p.beds} Bed</span>
        <span class="spec-chip"><i class="ti ti-bath" aria-hidden="true"></i> ${p.baths} Bath</span>
        <span class="spec-chip"><i class="ti ti-ruler-2" aria-hidden="true"></i> ${p.sqft} sqft</span>
      </div>
      <div class="card-footer">
        <div class="card-price">${p.price} <span>/ PDF plan</span></div>
        <div class="card-rating"><i class="ti ti-star-filled" aria-hidden="true"></i> ${p.rating} (${p.count})</div>
      </div>
    </div>`;
  card.addEventListener('click', () => {
    /* Replace with your actual navigation, e.g.: window.location.href = '/plans/' + p.id; */
    card.style.transition = 'transform 0.15s ease';
    card.style.transform  = 'scale(0.97)';
    setTimeout(() => { card.style.transform = ''; card.style.transition = ''; }, 180);
  });
  return card;
}

/* ── Render tab ── */
function setTab(btn, key) {
  document.querySelectorAll('.tab-pill').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-selected', 'false');
  });
  btn.classList.add('active');
  btn.setAttribute('aria-selected', 'true');

  track.style.opacity = 0;
  track.style.transition = 'opacity 0.2s';
  setTimeout(() => {
    track.innerHTML = '';
    tabData[key].forEach(p => track.appendChild(buildCard(p)));
    track.scrollTo({ left: 0 });
    track.style.opacity = 1;
  }, 200);
}

/* ── Scroll arrows ── */
function scrollTrack(dir) {
  const cardW = (track.querySelector('.plan-card')?.offsetWidth || 220) + 16;
  track.scrollBy({ left: dir * cardW * 2, behavior: 'smooth' });
}

/* ── Dot pagination ── */
function updateDots() {
  const maxScroll = track.scrollWidth - track.clientWidth;
  if (maxScroll <= 0) return;
  const page = Math.round((track.scrollLeft / maxScroll) * (dots.length - 1));
  dots.forEach((d, i) => d.classList.toggle('active', i === page));
}
track.addEventListener('scroll', updateDots, { passive: true });

function goPage(p) {
  const maxScroll = track.scrollWidth - track.clientWidth;
  track.scrollTo({ left: (p / (dots.length - 1)) * maxScroll, behavior: 'smooth' });
}

/* ── Wishlist toggle ── */
function toggleWish(e, btn) {
  e.stopPropagation();
  btn.classList.toggle('saved');
  const icon = btn.querySelector('i');
  if (btn.classList.contains('saved')) {
    icon.className = 'ti ti-heart-filled';
    btn.setAttribute('aria-label', btn.getAttribute('aria-label').replace('Save','Remove'));
  } else {
    icon.className = 'ti ti-heart';
    btn.setAttribute('aria-label', btn.getAttribute('aria-label').replace('Remove','Save'));
  }
}

/* ── Quick view ── */
function quickView(e, name) {
  e.stopPropagation();
  /* Replace with your modal/drawer logic */
  alert('Quick view: ' + name);
}

/* ── Init ── */
setTab(document.querySelector('.tab-pill.active'), 'related');
</script>
</body>
</html>
