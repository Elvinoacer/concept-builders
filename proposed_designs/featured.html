<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Featured Collections — House Plans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f7f6f3;
      --text-primary: #111111;
      --text-secondary: #666660;
      --border: rgba(0,0,0,0.10);
      --border-hover: rgba(0,0,0,0.22);
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --bg-secondary: #1e1e1c;
        --text-primary: #f0ede8;
        --text-secondary: #888880;
        --border: rgba(255,255,255,0.10);
        --border-hover: rgba(255,255,255,0.22);
      }
    }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ─── SECTION ─────────────────────────────────────── */
    .fc-section {
      max-width: 1120px;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
    }

    /* ─── HEADER ──────────────────────────────────────── */
    .fc-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .fc-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 0.6rem;
    }
    .fc-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }
    .fc-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      font-weight: 300;
    }

    /* ─── TABS ────────────────────────────────────────── */
    .fc-tabs-wrapper {
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 1.75rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .fc-tabs-wrapper::-webkit-scrollbar { display: none; }
    .fc-tabs {
      display: flex;
      gap: 0;
      white-space: nowrap;
    }
    .fc-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.65rem 1.1rem;
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--text-secondary);
      cursor: pointer;
      margin-bottom: -0.5px;
      transition: color 0.2s, border-color 0.2s;
    }
    .fc-tab:hover { color: var(--text-primary); }
    .fc-tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--text-primary);
      font-weight: 500;
    }

    /* ─── GRID ────────────────────────────────────────── */
    .fc-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    @media (max-width: 640px) {
      .fc-grid {
        grid-template-columns: 1fr 1fr;
      }
      .fc-card.featured {
        grid-column: span 2 !important;
      }
    }

    .fc-card {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      cursor: pointer;
      background: #1a2a3a;
    }
    .fc-card.featured {
      grid-column: span 2;
      aspect-ratio: 16 / 9;
    }
    .fc-card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .fc-card:hover .fc-card-bg { transform: scale(1.05); }

    .fc-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.08) 55%, transparent 100%);
      transition: opacity 0.3s;
    }
    .fc-card:hover .fc-card-overlay { opacity: 0.9; }

    .fc-card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 1rem 1rem 0.9rem;
      color: #fff;
    }
    .fc-card-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 3px;
    }
    .fc-card-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .fc-card.featured .fc-card-name { font-size: 18px; }
    .fc-card-meta {
      font-size: 11px;
      opacity: 0.65;
      font-weight: 300;
    }
    .fc-card-badge {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(255,255,255,0.18);
      border: 0.5px solid rgba(255,255,255,0.32);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #fff;
    }

    /* ─── PILL FILTER STRIP ───────────────────────────── */
    .fc-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 1.5rem;
    }
    .fc-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0.5px solid var(--border-hover);
      border-radius: 100px;
      padding: 5px 14px 5px 10px;
      font-size: 12px;
      font-weight: 400;
      color: var(--text-secondary);
      cursor: pointer;
      background: var(--bg);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .fc-pill:hover, .fc-pill.active {
      background: var(--text-primary);
      color: var(--bg);
      border-color: var(--text-primary);
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .fc-pill.active .dot { background: var(--bg) !important; }

    /* ─── FOOTER ──────────────────────────────────────── */
    .fc-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }
    .fc-count {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .fc-count strong { color: var(--text-primary); font-weight: 500; }
    .fc-cta {
      background: var(--text-primary);
      color: var(--bg);
      border: none;
      border-radius: var(--radius-md);
      padding: 0.55rem 1.3rem;
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.2s;
    }
    .fc-cta:hover { opacity: 0.78; }
  </style>
</head>
<body>

<section class="fc-section" aria-label="Featured House Plan Collections">

  <div class="fc-header">
    <p class="fc-eyebrow">Browse by style</p>
    <h2 class="fc-title">Featured Collections</h2>
    <p class="fc-subtitle">100+ professionally designed house plans, organized by style</p>
  </div>

  <div class="fc-tabs-wrapper">
    <div class="fc-tabs" id="tabBar" role="tablist"></div>
  </div>

  <div class="fc-grid" id="cardGrid"></div>

  <div class="fc-pills" id="pillStrip"></div>

  <div class="fc-footer">
    <span class="fc-count" id="footerCount"></span>
    <button class="fc-cta" id="viewAllBtn">View all plans →</button>
  </div>

</section>

<script>
  /* ─────────────────────────────────────────────────────
     DATA — Replace bg colors with your actual image URLs:
     change  bg: "#hex"  →  img: "path/to/image.jpg"
     then in renderGrid() swap the CSS bg-color for
     <img class="fc-card-bg" src="${plan.img}" alt="${plan.name}" />
  ───────────────────────────────────────────────────── */
  const collections = [
    {
      id: "modern", label: "Modern Homes", dot: "#5B9FD6", count: 18,
      plans: [
        { name: "Horizon Residence",  beds: "4 bed · 3 bath · 2,400 sqft", badge: "New",      bg: "#1a3a5c" },
        { name: "Vista Pavilion",     beds: "3 bed · 2 bath · 1,850 sqft", badge: null,       bg: "#1d3f6e" },
        { name: "Skyline Loft",       beds: "5 bed · 4 bath · 3,100 sqft", badge: "Popular",  bg: "#142e52" },
        { name: "Zenith Flat-Roof",   beds: "3 bed · 3 bath · 2,050 sqft", badge: null,       bg: "#1a3f6f" },
        { name: "Linear House",       beds: "4 bed · 2 bath · 2,200 sqft", badge: null,       bg: "#163358" },
      ]
    },
    {
      id: "luxury", label: "Luxury Villas", dot: "#C49A3C", count: 14,
      plans: [
        { name: "Grand Palazzo",      beds: "6 bed · 5 bath · 5,800 sqft", badge: "Exclusive",  bg: "#3b2810" },
        { name: "The Riviera",        beds: "5 bed · 5 bath · 4,900 sqft", badge: null,         bg: "#4a3012" },
        { name: "Monte Bellavista",   beds: "7 bed · 6 bath · 6,500 sqft", badge: "Top Rated",  bg: "#3d2a0e" },
        { name: "Sunset Manor",       beds: "4 bed · 4 bath · 4,200 sqft", badge: null,         bg: "#422e10" },
        { name: "The Windsor",        beds: "6 bed · 6 bath · 5,400 sqft", badge: null,         bg: "#3a2609" },
      ]
    },
    {
      id: "bungalow", label: "Family Bungalows", dot: "#4EA870", count: 22,
      plans: [
        { name: "The Homestead",      beds: "3 bed · 2 bath · 1,600 sqft", badge: "Best Seller", bg: "#12381f" },
        { name: "Meadow Bungalow",    beds: "4 bed · 2 bath · 1,900 sqft", badge: null,          bg: "#163d22" },
        { name: "Rosewood Cottage",   beds: "3 bed · 3 bath · 1,750 sqft", badge: "New",         bg: "#123520" },
        { name: "Prairie House",      beds: "4 bed · 3 bath · 2,100 sqft", badge: null,          bg: "#163820" },
        { name: "Garden Retreat",     beds: "3 bed · 2 bath · 1,500 sqft", badge: null,          bg: "#113018" },
      ]
    },
    {
      id: "duplex", label: "Duplex Designs", dot: "#A85CB0", count: 11,
      plans: [
        { name: "Twin Peaks Duplex",  beds: "2×3 bed · 2×2 bath · 3,200 sqft", badge: "Popular", bg: "#2e1035" },
        { name: "Mirror House",       beds: "2×4 bed · 2×3 bath · 3,800 sqft", badge: null,      bg: "#351238" },
        { name: "Urban Pair",         beds: "2×2 bed · 2×2 bath · 2,600 sqft", badge: "New",     bg: "#2a0e30" },
        { name: "Symmetra",           beds: "2×3 bed · 2×3 bath · 3,400 sqft", badge: null,      bg: "#311136" },
        { name: "Duo Residence",      beds: "2×4 bed · 2×2 bath · 3,600 sqft", badge: null,      bg: "#2c1032" },
      ]
    },
    {
      id: "smallplot", label: "Small Plot", dot: "#E06A50", count: 17,
      plans: [
        { name: "The Compact",        beds: "2 bed · 1 bath · 900 sqft",   badge: "Efficient", bg: "#3d1008" },
        { name: "Urban Micro",        beds: "3 bed · 2 bath · 1,100 sqft", badge: null,        bg: "#45120a" },
        { name: "Corner Plot Special",beds: "3 bed · 2 bath · 1,250 sqft", badge: "Popular",   bg: "#3a0f07" },
        { name: "Space Saver",        beds: "2 bed · 2 bath · 980 sqft",   badge: null,        bg: "#401108" },
        { name: "The Petite",         beds: "3 bed · 1 bath · 1,050 sqft", badge: null,        bg: "#361009" },
      ]
    },
    {
      id: "contemporary", label: "Contemporary", dot: "#4FA3BF", count: 18,
      plans: [
        { name: "The Studio Home",    beds: "4 bed · 3 bath · 2,300 sqft", badge: "Award Win", bg: "#0d2f3d" },
        { name: "Cascade Residence",  beds: "5 bed · 4 bath · 2,900 sqft", badge: null,        bg: "#0f3547" },
        { name: "Open Concept",       beds: "3 bed · 3 bath · 2,000 sqft", badge: "New",       bg: "#0c2c3a" },
        { name: "Floating Volumes",   beds: "4 bed · 3 bath · 2,500 sqft", badge: null,        bg: "#0e3245" },
        { name: "The Glass House",    beds: "4 bed · 4 bath · 2,700 sqft", badge: "Popular",   bg: "#0d2e40" },
      ]
    },
  ];

  let activeId = collections[0].id;
  const getActive = () => collections.find(c => c.id === activeId);

  function renderTabs() {
    const bar = document.getElementById('tabBar');
    bar.innerHTML = collections.map(c => `
      <button class="fc-tab ${c.id === activeId ? 'active' : ''}"
              role="tab" aria-selected="${c.id === activeId}"
              data-id="${c.id}">${c.label}</button>
    `).join('');
    bar.querySelectorAll('.fc-tab').forEach(btn =>
      btn.addEventListener('click', () => { activeId = btn.dataset.id; render(); })
    );
  }

  function renderGrid() {
    const col = getActive();
    const grid = document.getElementById('cardGrid');
    /*
      TO USE REAL IMAGES:
      Replace the <div class="fc-card-bg" ...> element with:
      <img class="fc-card-bg" src="${plan.img}" alt="${plan.name}" loading="lazy" />
      and add  plan.img  to each plan object above.
    */
    grid.innerHTML = col.plans.map((plan, i) => `
      <div class="fc-card ${i === 0 ? 'featured' : ''}" style="background:${plan.bg}" role="article">
        <div class="fc-card-bg" aria-hidden="true"></div>
        <div class="fc-card-overlay"></div>
        ${plan.badge ? `<span class="fc-card-badge">${plan.badge}</span>` : ''}
        <div class="fc-card-info">
          <div class="fc-card-label">${col.label}</div>
          <div class="fc-card-name">${plan.name}</div>
          <div class="fc-card-meta">${plan.beds}</div>
        </div>
      </div>
    `).join('');
  }

  function renderPills() {
    const strip = document.getElementById('pillStrip');
    strip.innerHTML = collections.map(c => `
      <button class="fc-pill ${c.id === activeId ? 'active' : ''}" data-id="${c.id}">
        <span class="dot" style="background:${c.id === activeId ? 'var(--bg)' : c.dot}"></span>
        ${c.label} <span style="opacity:0.5;margin-left:2px">${c.count}</span>
      </button>
    `).join('');
    strip.querySelectorAll('.fc-pill').forEach(btn =>
      btn.addEventListener('click', () => { activeId = btn.dataset.id; render(); })
    );
  }

  function renderFooter() {
    const col = getActive();
    document.getElementById('footerCount').innerHTML =
      `Showing <strong>${col.plans.length}</strong> of <strong>${col.count}</strong> plans in ${col.label}`;
    document.getElementById('viewAllBtn').onclick = () =>
      window.location.href = `/plans?category=${col.id}`;
  }

  function render() {
    renderTabs();
    renderGrid();
    renderPills();
    renderFooter();
  }

  render();
</script>
</body>
</html>
