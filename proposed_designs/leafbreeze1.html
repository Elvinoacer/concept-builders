<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windy Branch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f4f8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: system-ui, sans-serif;
        }

        .scene {
            position: relative;
            width: 900px;
            height: 400px;
            perspective: 1200px;
        }

        .branch-container {
            position: absolute;
            left: 50px;
            top: 120px;
            transform-origin: 8% 45%; /* Base of the branch (left side) */
            animation: main-sway 8s ease-in-out infinite;
            filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.15));
        }

        .branch {
            width: 820px;
            height: auto;
            display: block;
            max-width: 100%;
            /* Subtle natural lighting adjustment */
            filter: brightness(1.05) contrast(1.08) saturate(1.15);
        }

        /* Extra layer for more dynamic leaf movement */
        .leaf-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('leaf.png') no-repeat center;
            background-size: contain;
            pointer-events: none;
            opacity: 0.75;
            mix-blend-mode: multiply;
            animation: leaf-flutter 3.5s ease-in-out infinite alternate;
            transform-origin: 8% 45%;
        }

        /* Wind effect keyframes */
        @keyframes main-sway {
            0%, 100% {
                transform: rotate(-4deg) translateY(0px);
            }
            25% {
                transform: rotate(2deg) translateY(-8px);
            }
            50% {
                transform: rotate(-3deg) translateY(4px);
            }
            75% {
                transform: rotate(5deg) translateY(-6px);
            }
        }

        @keyframes leaf-flutter {
            0% {
                transform: rotate(-2deg) scale(1.01);
            }
            100% {
                transform: rotate(4deg) scale(0.98);
            }
        }

        /* Right side gets stronger wind (extra element) */
        .right-wind {
            position: absolute;
            top: 0;
            left: 45%;
            width: 55%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255,255,255,0.08) 40%,
                rgba(255,255,255,0.12) 70%,
                transparent 100%);
            pointer-events: none;
            animation: right-wind-gust 5s ease-in-out infinite;
            border-radius: 50%;
            filter: blur(2px);
            mix-blend-mode: overlay;
        }

        @keyframes right-wind-gust {
            0%, 100% { 
                transform: translateX(0) rotate(1deg); 
                opacity: 0.6;
            }
            50% { 
                transform: translateX(12px) rotate(-2deg); 
                opacity: 0.85;
            }
        }

        /* Gentle highlight that moves with wind */
        .highlight {
            position: absolute;
            top: -20%;
            left: 10%;
            width: 120%;
            height: 180%;
            background: linear-gradient(
                120deg,
                transparent 30%,
                rgba(255, 255, 255, 0.35) 45%,
                transparent 60%
            );
            pointer-events: none;
            animation: light-sweep 12s linear infinite;
            opacity: 0.4;
            mix-blend-mode: screen;
        }

        @keyframes light-sweep {
            0% { transform: translateX(-80%) rotate(-8deg); }
            100% { transform: translateX(120%) rotate(8deg); }
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="branch-container">
            <!-- Main branch image -->
            <img src="leaf.png" alt="Branch with leaves" class="branch" id="branchImg">
            
            <!-- Extra leaf movement layer -->
            <div class="leaf-layer"></div>
            
            <!-- Right-side wind emphasis -->
            <div class="right-wind"></div>
            
            <!-- Moving light highlight -->
            <div class="highlight"></div>
        </div>
        
        <div class="info">Subtle wind • Right side stronger</div>
    </div>

    <script>
        // Optional: Add slight randomness to feel more organic
        const branch = document.getElementById('branchImg');
        let time = 0;
        
        function gentleBreath() {
            time += 0.008;
            const breath = Math.sin(time) * 0.8;
            branch.style.transform = `rotate(${breath}deg)`;
            requestAnimationFrame(gentleBreath);
        }
        
        // Start breathing animation (very subtle)
        setTimeout(() => {
            gentleBreath();
        }, 800);
    </script>
</body>
</html>
